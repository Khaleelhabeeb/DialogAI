<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Dialog AI</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="container">
      <div class="left-panel">
        <h1 id="dialog-ai-title">Dialog AI</h1>
        <img id="dialog-ai-image" src="../assets/bg.png" alt="Dialog AI Image">
      </div>
      <div class="right-panel">
        <div id="thought-bubble"></div>
        <button id="talk-button">Talk</button>
        <button id="interrupt-button">Interrupt</button>
        <button id="stop-button">STOP</button>
        <div id="recording-label">Recording...</div>
      </div>
    </div>
    <script src="renderer.js"></script>
  </body>
</html>
